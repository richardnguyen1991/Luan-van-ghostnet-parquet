name: Run Kaggle GhostNet CPU sessions

on:
  workflow_dispatch:
    inputs:
      force_push:
        description: Force a new Kaggle version even when the watchdog would wait
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - "src/*.py"
      - "scripts/*.py"
      - "configs/*"
      - "kaggle_step8_notebook.ipynb"
      - "kernel-metadata.json"
      - ".github/workflows/run-kaggle.yml"

permissions:
  contents: read

concurrency:
  group: kaggle-ghostnet-cpu-watchdog
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN_SECRET: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PREFIX: ${{ secrets.S3_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install orchestration dependency
        run: python -m pip install --disable-pip-version-check "boto3>=1.34,<2"

      - name: Normalize secrets without printing values
        shell: python
        run: |
          import os
          from pathlib import Path
          names = ("KAGGLE_USERNAME", "KAGGLE_API_TOKEN_SECRET", "KAGGLE_KERNEL",
                   "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN",
                   "AWS_REGION", "AWS_DEFAULT_REGION", "S3_BUCKET", "S3_PREFIX")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              for name in names:
                  value = os.environ.get(name)
                  if value is not None:
                      cleaned = value.replace("\r", "").replace("\n", "").replace("\\r", "").replace("\\n", "").strip()
                      handle.write(f"{name}={cleaned}\n")

      - name: Configure Kaggle token and validate GitHub Secrets
        shell: python
        run: |
          import json, os
          from pathlib import Path
          required = ("KAGGLE_API_TOKEN_SECRET", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY",
                      "AWS_DEFAULT_REGION", "S3_BUCKET", "S3_PREFIX")
          missing = [name for name in required if not os.environ.get(name)]
          if missing: raise RuntimeError("Missing GitHub Secrets: " + ", ".join(missing))
          token = os.environ["KAGGLE_API_TOKEN_SECRET"]
          env = Path(os.environ["GITHUB_ENV"])
          if token.startswith("KGAT_"):
              with env.open("a", encoding="utf-8") as handle: handle.write(f"KAGGLE_API_TOKEN={token}\n")
          else:
              if token.lstrip().startswith("{"):
                  credentials = json.loads(token); username = credentials["username"]; key = credentials["key"]
              else:
                  username = os.environ.get("KAGGLE_USERNAME", ""); key = token
              if not username: raise RuntimeError("KAGGLE_USERNAME is required for a legacy Kaggle key")
              with env.open("a", encoding="utf-8") as handle: handle.write(f"KAGGLE_USERNAME={username}\nKAGGLE_KEY={key}\nKAGGLE_API_TOKEN={key}\n")
          if not os.environ.get("KAGGLE_KERNEL"):
              kernel = json.load(open("configs/orchestration.json"))["kaggle_kernel"]
              with env.open("a", encoding="utf-8") as handle: handle.write(f"KAGGLE_KERNEL={kernel}\n")

      - name: Decide whether a session is needed
        id: decision
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.force_push || false }}" == "true" ]]; then args+=(--force); fi
          python scripts/kaggle_orchestrator.py decide --kernel "${KAGGLE_KERNEL}" --github-output "${GITHUB_OUTPUT}" "${args[@]}"

      - name: Build CPU notebook with short-lived S3 URLs
        if: steps.decision.outputs.should_push == 'true'
        shell: bash
        run: |
          mkdir -p .kaggle_bundle
          python scripts/generate_presigned_config.py --output .kaggle_bundle/s3.json \
            --bucket "${S3_BUCKET}" --s3-prefix "${S3_PREFIX}" --epochs 100 --expires 86400 --region "${AWS_DEFAULT_REGION}"
          python scripts/build_step8_notebook.py --presigned-config .kaggle_bundle/s3.json --output .kaggle_bundle/kaggle_notebook.ipynb
          rm .kaggle_bundle/s3.json
          cp kernel-metadata.json .kaggle_bundle/kernel-metadata.json

      - name: Validate bundle is CPU-only and contains no AWS secret
        if: steps.decision.outputs.should_push == 'true'
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path(".kaggle_bundle")
          metadata = json.loads((root / "kernel-metadata.json").read_text())
          notebook = json.loads((root / metadata["code_file"]).read_text())
          source = "\n".join("".join(cell.get("source", [])) for cell in notebook["cells"])
          assert metadata["enable_gpu"] in (False, "false")
          assert metadata["dataset_sources"] == ["dungnguyen28101991/cicddos2019-parquet"]
          assert '"--device", "cpu"' in source
          assert "PRESIGNED_CONFIG_B64" in source
          assert "AWS_SECRET_ACCESS_KEY=" not in source

      - name: Push and start Kaggle session
        if: steps.decision.outputs.should_push == 'true'
        shell: bash
        run: |
          timeout_seconds="$(python -c 'import json; print(json.load(open("configs/orchestration.json"))["kaggle_session_timeout_seconds"])')"
          python scripts/kaggle_http.py push --path .kaggle_bundle --timeout "${timeout_seconds}"

      - name: Record launch in S3
        if: steps.decision.outputs.should_push == 'true'
        run: python scripts/kaggle_orchestrator.py record-push --reason "${{ steps.decision.outputs.reason }}"

      - name: Report decision
        run: |
          echo "Kernel status: ${{ steps.decision.outputs.kernel_status }}"
          echo "Completed epoch: ${{ steps.decision.outputs.completed_epoch }}"
          echo "Push next session: ${{ steps.decision.outputs.should_push }}"
          echo "Reason: ${{ steps.decision.outputs.reason }}"
