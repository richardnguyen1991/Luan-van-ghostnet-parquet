name: Run Kaggle CPU notebook

on:
  workflow_dispatch:
    inputs:
      max_sessions:
        description: Maximum Kaggle attempts (1-3); use more than 1 only for an explicit retry
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      poll_interval_seconds:
        description: Seconds between Kaggle status checks
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "60"
          - "120"
      session_timeout_minutes:
        description: Stop polling after this many minutes (GitHub hard limit is 360)
        required: true
        default: "330"
        type: choice
        options:
          - "60"
          - "180"
          - "330"
      upload_outputs_to_s3:
        description: Download successful Kaggle outputs and sync them to S3 from GitHub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kaggle-cpu-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sampled-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4

      - name: Rebuild checked-in Kaggle notebook payload
        run: python scripts/build_kaggle_notebook.py

      - name: Validate non-secret CPU configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "Missing KAGGLE_API_TOKEN"; exit 1; }
          test -n "${KAGGLE_KERNEL:-}" || { echo "Missing KAGGLE_KERNEL"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("kernel-metadata.json").read_text(encoding="utf-8"))
          mirror = json.loads(Path("kaggle.json").read_text(encoding="utf-8"))
          assert metadata["id"] == mirror["id"]
          assert metadata["id"] == "dungnguyen28101991/luan-van-ghostnet-parquet"
          assert metadata["enable_gpu"] is False
          assert metadata["dataset_sources"] == ["dungnguyen28101991/cicddos2019-parquet"]
          assert Path(metadata["code_file"]).is_file()
          PY

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet --upgrade kaggle

      - name: Push and monitor bounded Kaggle session
        id: kaggle
        shell: bash
        env:
          MAX_SESSIONS: ${{ inputs.max_sessions }}
          POLL_SECONDS: ${{ inputs.poll_interval_seconds }}
          SESSION_TIMEOUT_MINUTES: ${{ inputs.session_timeout_minutes }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + SESSION_TIMEOUT_MINUTES * 60 ))
          completed=false

          for attempt in $(seq 1 "$MAX_SESSIONS"); do
            echo "Starting bounded Kaggle attempt ${attempt}/${MAX_SESSIONS} on CPU metadata"
            kaggle kernels push -p .

            while (( $(date +%s) < deadline )); do
              status_output="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1)"
              status_lower="$(printf '%s' "$status_output" | tr '[:upper:]' '[:lower:]')"
              echo "Kaggle status checked at $(date -u +%FT%TZ)"

              if [[ "$status_lower" == *"complete"* ]]; then
                completed=true
                break
              fi
              if [[ "$status_lower" == *"error"* || "$status_lower" == *"failed"* || "$status_lower" == *"cancel"* ]]; then
                echo "Kaggle attempt ${attempt} ended unsuccessfully"
                break
              fi
              sleep "$POLL_SECONDS"
            done

            if [[ "$completed" == true ]]; then
              break
            fi
            if (( $(date +%s) >= deadline )); then
              echo "Session timeout reached; no additional attempt will be started"
              exit 124
            fi
          done

          if [[ "$completed" != true ]]; then
            echo "Kaggle did not complete within MAX_SESSIONS=${MAX_SESSIONS}"
            exit 1
          fi
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Download successful Kaggle outputs
        if: steps.kaggle.outputs.completed == 'true'
        run: kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output --force

      - name: Upload outputs as a GitHub artifact
        if: steps.kaggle.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-step7-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 14

      - name: Validate S3 secrets
        if: steps.kaggle.outputs.completed == 'true' && inputs.upload_outputs_to_s3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "Missing AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo "Missing AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${AWS_DEFAULT_REGION:-}" || { echo "Missing AWS_DEFAULT_REGION"; exit 1; }
          test -n "${S3_BUCKET:-}" || { echo "Missing S3_BUCKET"; exit 1; }
          test -n "${S3_PREFIX:-}" || { echo "Missing S3_PREFIX"; exit 1; }

      - name: Sync outputs to S3 from GitHub
        if: steps.kaggle.outputs.completed == 'true' && inputs.upload_outputs_to_s3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
        run: >-
          aws s3 sync kaggle-output
          "s3://${S3_BUCKET}/${S3_PREFIX}/step7/${GITHUB_RUN_ID}/"
          --only-show-errors

